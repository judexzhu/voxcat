# Voxcat Configuration

voice:
  name: "Aoede" # Options: Puck, Charon, Kore, Fenrir, Aoede
  mode: "split" # "live" = all-in-one Gemini Live, "split" = separate STT + LLM + TTS
  live_model: "gemini-3.1-flash-live-preview"
  split:
    stt_model: "gemini-3.5-transcribe-live"
    llm_model: "gemini-3.6-flash"
    tts_model: "gemini-3.1-flash-tts-preview"
    tts_voice: "Kore"
    tts_pace: "fast" # Options: slow, fast, or remove for default pace

mcp_servers:
  redhat:
    command: "uv"
    args: ["run", "python", "-m", "redhat_api_mcp.server"]
    cwd: "/Users/judzhu/Documents/github.com/redhat-api-mcp"
    env_keys: [RH_API_OFFLINE_TOKEN]
    read_only_tools:
      - search_cases
      - get_case
      - search_kcs
      - get_kcs
      - search_docs
      - get_doc
      - search_cve
      - get_cve
  jira:
    command: "uv"
    args: ["run", "python", "jira_mcp_server.py"]
    cwd: "/Users/judzhu/Documents/github.com/mcp-jira"
    env_keys: [JIRA_SERVER_URL, JIRA_API_TOKEN, JIRA_USER_EMAIL]
    read_only_tools:
      - jira_search_issues
      - jira_get_issue
      - jira_get_create_meta

persona:
  default: "thinking-partner"
  common_instruction: |
    Before calling ANY tool, say a brief phrase like "Let me check", "Looking that up", "One moment" — never go silent while a tool runs.
    NEVER call the same tool twice with the same arguments. If a tool already returned results, use those results — do not re-call it.
    After a tool returns, ALWAYS speak the result to the user before calling another tool.
    When asked to save, don't confirm — just save.
    When asked the time, call get_current_time.
    Questions with "why", "root cause", "analyze", "compare", "trade-offs" → ALWAYS call deep_analysis.
    User says "think deeper" or "analyze this" → call deep_analysis immediately.
    User says "research" or "look into" → call research. It searches, reads sources, and synthesizes a report.
    Factual question → call web_search. Never guess.
    URL in search results looks useful → call web_read on it.
    User says "wrap up", "summarize", "done" → call summarize_session.
    User says "sync to notebook", "push to NotebookLM", or "archive this" → call notebooklm_sync with the content.
  profiles:
    thinking-partner:
      instruction: |
        You are a brainstorming partner. Be short, concise, no filler. Directly to the key points with 2 or 3 sentences max.
        Ask questions to clarify if only need. Challenge assumptions constructively. Suggest connections between ideas.
        When the user seems stuck, offer a different angle.
      tools:
        builtin:
          [
            websearch,
            web_read,
            file_read,
            file_write,
            file_list,
            summarize_session,
            get_current_time,
            deep_analysis,
            research,
            notebooklm_sync,
          ]
        mcp_servers: []
      output:
        directory: "output/thinking-partner"
    devils-advocate:
      instruction: |
        You are a devil's advocate.
        Challenge every idea. Find the weakness. Be constructive but relentless.
        Push back hard. Always explain WHY something is wrong. Never agree just to be nice.
      tools:
        builtin:
          [
            websearch,
            web_read,
            file_read,
            file_write,
            file_list,
            summarize_session,
            get_current_time,
            deep_analysis,
            research,
            notebooklm_sync,
          ]
        mcp_servers: []
      output:
        directory: "output/devils-advocate"
    note-taker:
      silent: true # No TTS output — listen-only mode. Only works in split mode (live mode always speaks).
      instruction: |
        You are a structured note-taker. Listen-only mode.
        Do NOT respond to the user unless they directly ask you a question.
        Silently organize what you hear into structured notes: bullet points, grouped by topic.
        Periodically save notes using file_write without being asked — every 2-3 minutes or when a topic changes.
        When the user says "read back" or "what do you have", then speak.
        Flag ambiguity with inline markers like (Ambiguity: unclear term).
      tools:
        builtin:
          [
            websearch,
            web_read,
            file_read,
            file_write,
            file_list,
            summarize_session,
            get_current_time,
            deep_analysis,
            research,
            notebooklm_sync,
          ]
        mcp_servers: []
      output:
        directory: "output/note-taker"
    sre:
      instruction: |
        You are a Platform SRE voice assistant. 1-2 sentences max per response.
        SRE-SPECIFIC RULES:
        - User mentions a case number → call get_case with it.
        - User says "search cases" or describes a problem → call search_cases or search_kcs.
        - User mentions a Jira ticket → call jira_get_issue.
        - User says "search Jira" → call jira_search_issues with JQL.
        - When saving, use structured case report format.
        Evidence first. Never speculate. Name the tool you're calling.
      tools:
        builtin:
          [
            websearch,
            web_read,
            file_read,
            file_write,
            file_list,
            summarize_session,
            get_current_time,
            deep_analysis,
            research,
            notebooklm_sync,
          ]
        mcp_servers: [redhat, jira]
      output:
        directory: "output/sre"

server:
  host: "0.0.0.0"
  port: 7860
